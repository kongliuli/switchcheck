name: release
# Push a tag like v0.2.0 → builds installers on all three OSes and attaches
# them to a GitHub Release. Per-OS builds are required: DMG needs macOS,
# AppImage/deb need Linux, NSIS needs Windows.
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # CSC_IDENTITY_AUTO_DISCOVERY=false → skip macOS signing when no cert is
      # configured; add CSC_LINK/CSC_KEY_PASSWORD secrets to sign + notarize.
      # electron-builder's github publish creates a DRAFT release and attaches
      # the installers (all three matrix jobs attach to the same draft).
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the packaged app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE=$(find dist -type f -name "SwitchCheck.exe" | head -1)
            "$EXE" --smoke
          elif [ "$RUNNER_OS" = "macOS" ]; then
            EXE=$(find dist -path "*SwitchCheck.app/Contents/MacOS/SwitchCheck" -type f | head -1)
            "$EXE" --smoke
          else
            sudo apt-get update -y && sudo apt-get install -y xvfb
            EXE=$(find dist -type f -name "switchcheck" | head -1)
            # --no-sandbox: the SUID chrome-sandbox helper can't be chowned in CI
            xvfb-run -a "$EXE" --no-sandbox --smoke
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
