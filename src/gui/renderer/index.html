<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<title>SwitchCheck — 换环境体检</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="brand">
      <div class="logo">🚦</div>
      <div>
        <div class="name">SwitchCheck</div>
        <div class="tagline" data-i18n="tagline"></div>
      </div>
    </div>

    <section class="panel">
      <h2 data-i18n="panelType"></h2>
      <div class="choices" id="typeChoices" role="radiogroup" aria-label="check type">
        <button type="button" class="choice on" data-type="linux" role="radio" aria-checked="true">
          <div class="icon">🐧</div>
          <div>
            <div class="t" data-i18n="type.linux"></div>
            <div class="d" data-i18n="type.linux.d"></div>
          </div>
        </button>
        <button type="button" class="choice" data-type="ci" role="radio" aria-checked="false">
          <div class="icon">⚙️</div>
          <div>
            <div class="t" data-i18n="type.ci"></div>
            <div class="d" data-i18n="type.ci.d"></div>
          </div>
        </button>
        <button type="button" class="choice" data-type="runtime" role="radio" aria-checked="false">
          <div class="icon">⏱️</div>
          <div>
            <div class="t" data-i18n="type.runtime"></div>
            <div class="d" data-i18n="type.runtime.d"></div>
          </div>
        </button>
      </div>
    </section>

    <section class="panel">
      <h2 data-i18n="panelTarget"></h2>

      <!-- linux targets -->
      <div class="choices small" id="linuxTargets" role="radiogroup" aria-label="target (migration)">
        <button type="button" class="choice on" data-target="local" role="radio" aria-checked="true">
          <div class="icon">💻</div>
          <div><div class="t" data-i18n="target.local"></div></div>
        </button>
        <button type="button" class="choice" data-target="ssh" role="radio" aria-checked="false">
          <div class="icon">🌐</div>
          <div><div class="t" data-i18n="target.sshWin"></div></div>
        </button>
      </div>

      <!-- ci / runtime targets -->
      <div class="choices small" id="ciTargets" role="radiogroup" aria-label="target (repo checks)" hidden>
        <button type="button" class="choice on" data-target="local" role="radio" aria-checked="true">
          <div class="icon">📁</div>
          <div><div class="t" data-i18n="target.localRepo"></div></div>
        </button>
        <button type="button" class="choice" data-target="ssh" role="radio" aria-checked="false">
          <div class="icon">🌐</div>
          <div><div class="t" data-i18n="target.sshRepo"></div></div>
        </button>
      </div>

      <div id="ciLocalBlock" class="subblock" hidden>
        <label class="field">
          <span data-i18n="repoPath"></span>
          <div class="row">
            <input type="text" id="ciPathInput" placeholder="D:/path/to/repo">
            <button id="ciBrowseBtn" class="ghost" data-i18n="browse"></button>
          </div>
        </label>
      </div>

      <div id="ciRemoteBlock" class="subblock" hidden>
        <label class="field">
          <span data-i18n="remoteRepoPath"></span>
          <input type="text" id="remotePathInput" placeholder="~/my-repo 或 D:/Code/my-repo">
        </label>
      </div>

      <div id="sshBlock" class="subblock" hidden>
        <label class="field">
          <span data-i18n="sshConn"></span>
          <div class="row">
            <select id="profileSelect"></select>
            <button id="manageBtn" class="ghost" data-i18n="manage"></button>
          </div>
        </label>
        <label class="field" id="sshPasswordRow">
          <span data-i18n="sshPassword"></span>
          <input type="password" id="sshPasswordInput" placeholder="••••••••">
        </label>
        <label class="field" id="sshPassphraseRow">
          <span data-i18n="sshPassphrase"></span>
          <input type="password" id="sshPassphraseInput" placeholder="••••••••">
        </label>
        <details class="hintbox">
          <summary data-i18n="sshHintTitle"></summary>
          <div class="hintbody">
            <span data-i18n="sshHintBody"></span><br>
            <code>Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0</code><br>
            <code>Start-Service sshd; Set-Service sshd -StartupType Automatic</code><br>
            <span data-i18n="sshHintOr"></span>
          </div>
        </details>
        <div class="hint" id="sshTargetHint"></div>
      </div>
    </section>

    <button id="runBtn" data-i18n="run"></button>

    <section class="panel" id="progressPanel" hidden>
      <h2><span data-i18n="progress"></span> <button id="clearProgressBtn" class="ghost" data-i18n="clear"></button></h2>
      <div id="progressLog" aria-live="polite"></div>
    </section>

    <div class="side-actions">
      <button id="historyBtn" class="ghost" data-i18n="history"></button>
      <button id="updatePill" class="ghost" hidden></button>
    </div>

    <footer class="about">
      <button id="themeBtn" class="ghost"></button>
      <button id="langBtn" class="ghost"></button>
      <div id="versionFoot"></div>
    </footer>
  </aside>

  <main id="main">
    <div id="errorBox" class="error" role="alert" hidden></div>

    <div id="empty">
      <div class="big">🚦</div>
      <h1 data-i18n="emptyTitle"></h1>
      <p data-i18n="emptyLead"></p>
      <div class="steps">
        <div class="step"><i>1</i><span data-i18n="step1"></span></div>
        <div class="step"><i>2</i><span data-i18n="step2"></span></div>
        <div class="step"><i>3</i><span data-i18n="step3"></span></div>
      </div>
    </div>

    <div id="result" hidden>
      <div id="diffBox" class="diffbox" hidden></div>
      <div id="verdictBanner" class="verdict">
        <div class="v-icon" id="verdictIcon"></div>
        <div class="v-body">
          <h2 class="v-head" id="verdictHead"></h2>
          <div class="v-sub" id="verdictSub"></div>
        </div>
        <div class="v-stats" id="verdictStats"></div>
      </div>

      <div class="toolbar">
        <div class="filters" id="filterChips" role="group" aria-label="filter">
          <button data-f="all" class="on" aria-pressed="true"><span data-i18n="all"></span><b class="count">0</b></button>
          <button data-f="red" aria-pressed="false"><span class="dot red"></span><span data-i18n-status="red"></span><b class="count">0</b></button>
          <button data-f="yellow" aria-pressed="false"><span class="dot yellow"></span><span data-i18n-status="yellow"></span><b class="count">0</b></button>
          <button data-f="green" aria-pressed="false"><span class="dot green"></span><span data-i18n-status="green"></span><b class="count">0</b></button>
          <button data-f="info" aria-pressed="false"><span class="dot info"></span><span data-i18n-status="info"></span><b class="count">0</b></button>
        </div>
        <div class="exports">
          <button id="trialBtn" class="primary" hidden data-i18n="trialBtn" data-i18n-title="trialTitle"></button>
          <button id="exportHtml" class="ghost" data-i18n="exportHtml"></button>
          <button id="exportMd" class="ghost" data-i18n="exportMd"></button>
          <button id="exportJson" class="ghost" data-i18n="exportJson"></button>
        </div>
      </div>

      <div id="sections"></div>
    </div>
  </main>
</div>

<div id="modalRoot"></div>

<script src="../../labels.js"></script>
<script src="mock-api.js"></script>
<script src="app.js"></script>
</body>
</html>
